          stroke="#306c00" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="36"
        font-family="Inter, 'Segoe UI', Roboto, system-ui, sans-serif"
        font-size="22" font-weight="700"
        fill="#181c1e" letter-spacing="-0.5">
    Spring<tspan fill="#6db33f">Food</tspan>
  </text>

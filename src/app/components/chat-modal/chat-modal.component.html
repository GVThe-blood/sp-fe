<!-- Chat Modal -->
<div *ngIf="isOpen" class="fixed bottom-margin-desktop right-margin-desktop w-[360px] h-[520px] bg-surface-container-lowest rounded-xl shadow-[0_12px_40px_rgba(0,0,0,0.1)] flex flex-col z-50 overflow-hidden border border-surface-variant font-body-md text-on-background">
  <!-- Header -->
  <div class="flex items-center justify-between p-unit bg-surface-container-lowest border-b border-surface-variant">
    <div class="flex items-center gap-unit">
      <div class="relative w-10 h-10 rounded-full overflow-hidden bg-surface-container-highest">
        <img alt="Support Avatar" class="w-full h-full object-cover" data-alt="A highly detailed portrait of a friendly customer support agent. The lighting is soft and professional, highlighting a welcoming expression. The setting is a clean, modern office environment. The image uses a light-mode aesthetic with a palette of soft whites and natural skin tones, aligning with a premium brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCbw7HfGu3IqH9I4lKJXo1Xf84lN8xeyKia9n5do_0V96JKOdwR3V2hnNf9AohYcM78hXODQE93qouOm6gme5K6Qkwx4C3SFRhfrU0AZZVN3eZ8Umm32s1eYbvhMVO_UYIxMqBHI9U4FiLCXJWzXPk3pXhUr0Nq5XBWkLg7qMy6sRbGuNz9oACYzD8vB8CoSThAevzsBz1y68jDe-Ixzzhx0SRbIPs93saK4VELXwPRYYBpmMFmi7TJBQOEACzBpx_rFzj2h-6pwkwK"/>
        <div class="absolute bottom-0 right-0 w-3 h-3 bg-primary-container border-2 border-surface-container-lowest rounded-full"></div>
      </div>
      <div>
        <h3 class="font-label-md text-label-md text-on-surface">SpringFood Support</h3>
        <p class="font-body-md text-[12px] text-outline">Typically replies in a few minutes</p>
      </div>
    </div>
    <button (click)="closeModal()" class="text-outline hover:text-on-surface transition-colors p-1">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
    </button>
  </div>
  <!-- Message History -->
  <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-surface-bright">
    <!-- Received Message -->
    <div class="flex gap-2 items-end">
      <div class="w-6 h-6 rounded-full overflow-hidden bg-surface-container-highest flex-shrink-0">
        <img alt="Support Avatar" class="w-full h-full object-cover" data-alt="A highly detailed portrait of a friendly customer support agent. The lighting is soft and professional, highlighting a welcoming expression. The setting is a clean, modern office environment. The image uses a light-mode aesthetic with a palette of soft whites and natural skin tones, aligning with a premium brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4-VvemWLdpIcq7kDHsQiOyqScQb5M-LO76JQ_OGTix0LUfEMcPIKBC9a1UjGP2Cj41LedRZHPtzIvVcRkkG4Bqg5rzpl2x2Uto4kW-1cmkPuSx4WR7fGE4-4hSyjbGgvmJwAYpvTbdqvt__KIYtkLHsX5IbIGhShmMWuVwV3fDR_eT6p016fSKxI5EwLEUkOm9-aemt44JvWv7LghK07O3bFY5CzZVKN_AvUAsCFHVGR65wMzSDfbraUZ_MUrStDrxXr2kvue8y-6"/>
      </div>
      <div class="flex flex-col gap-1 max-w-[80%]">
        <div class="bg-surface-container-high text-on-surface p-3 rounded-lg rounded-bl-none font-body-md text-sm shadow-sm">
                                Hi there! How can I help you with your order today?
                            </div>
        <span class="text-[10px] text-outline ml-1">10:42 AM</span>
      </div>
    </div>
    <!-- Sent Message -->
    <div class="flex gap-2 items-end justify-end">
      <div class="flex flex-col gap-1 max-w-[80%] items-end">
        <div class="bg-primary-container text-on-primary-container p-3 rounded-lg rounded-br-none font-body-md text-sm shadow-sm">
                                I need to update my delivery address for tomorrow's organic box.
                            </div>
        <div class="flex items-center gap-1">
          <span class="text-[10px] text-outline mr-1">10:45 AM</span>
          <span class="material-symbols-outlined text-[14px] text-primary-container" style="font-variation-settings: 'FILL' 0;">done_all</span>
        </div>
      </div>
    </div>
    <!-- Received Message (Typing Indicator) -->
    <div class="flex gap-2 items-end">
      <div class="w-6 h-6 rounded-full overflow-hidden bg-surface-container-highest flex-shrink-0">
        <img alt="Support Avatar" class="w-full h-full object-cover" data-alt="A highly detailed portrait of a friendly customer support agent. The lighting is soft and professional, highlighting a welcoming expression. The setting is a clean, modern office environment. The image uses a light-mode aesthetic with a palette of soft whites and natural skin tones, aligning with a premium brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMniJWXGEJsrVDPwGz_jo8bRWwVh6IdBilxtNf8BIy3Z_wPbKoKR1_r_jvBDEyFKC1QTGdr2Hq_PXxZefuvK8kSKSLGWS0OmkozvljDnreE1wDhi5YKpqcRvLp1i0HTqO-6ClV_m1w5KiTi3wM7Ozgl4B1aEmANu-o7cq7qKDLjHp2s8fBe9jOZDZKvSMmFmBvxmsPFY6lG1_9hQiU0bM9ILp7k-s8hWCstr65sEnawTiAsVhvVkiFEYk72YOB4Ox7rz6T8klZYeIU"/>
      </div>
      <div class="flex flex-col gap-1 max-w-[80%]">
        <div class="bg-surface-container-high text-on-surface p-3 rounded-lg rounded-bl-none font-body-md text-sm shadow-sm flex items-center gap-1 h-10 w-16 justify-center">
          <div class="w-1.5 h-1.5 bg-outline rounded-full"></div>
          <div class="w-1.5 h-1.5 bg-outline rounded-full"></div>
          <div class="w-1.5 h-1.5 bg-outline rounded-full"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- Input Area -->
  <div class="p-unit bg-surface-container-lowest border-t border-surface-variant flex items-center gap-2">
    <button class="text-outline hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container-low flex-shrink-0">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">sentiment_satisfied</span>
    </button>
    <button class="text-outline hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container-low flex-shrink-0">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">attach_file</span>
    </button>
    <div class="flex-1 relative">
      <input class="w-full bg-surface-container-low text-on-surface border-none rounded-full px-4 py-2 font-body-md text-sm focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest outline-none transition-all placeholder-outline" placeholder="Type a message..." type="text"/>
    </div>
    <button class="bg-primary-container text-on-primary-container p-2 rounded-full hover:opacity-90 transition-opacity flex-shrink-0 flex items-center justify-center">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
    </button>
  </div>
</div>

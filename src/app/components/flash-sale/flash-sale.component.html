<!-- Flash Sale Hero Banner -->
<section class="w-full rounded-[24px] overflow-hidden relative min-h-[350px] md:min-h-[400px] flex items-center justify-start p-6 md:p-12 soft-shadow group">
  <!-- Background Image -->
  <div class="absolute inset-0 z-0">
    <img 
      alt="Delicious food spread" 
      class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-1000" 
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuDbaeZcWsT5Zbrc3wu9VwzpRO5aAQsyuvg_rIFo7LE6rxw5bwdR557qCTt4B2ByWDow6QUs61eXJvVCQiVBpPL_nrGICw2be1sLJ6o5qEOxNncXw8sM1hZpdOLQDzVOpA493uwbFPd_Q8O87cshbRhsM3o6e2DaCm5uZ0IJ0tiD91OBd9RlpgJ1jrsCEdjWg9m2wMEmFNHXdQdxUGzX9ufPDlPqv5Aaq22bYaZgt03S8UQmhyHx9PxMIk2hl4BtLKlgvZKuH3jOVcB4"
    />
    <!-- Gradient Overlay for text legibility -->
    <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent"></div>
  </div>
  
  <!-- Content -->
  <div class="relative z-10 max-w-lg text-on-primary">
    <span class="inline-block px-4 py-2 bg-[#ff8928] text-white font-bold text-sm uppercase tracking-widest rounded-full mb-4">
      FLASH SALE
    </span>
    <h1 class="text-4xl md:text-5xl font-bold text-white mb-6 leading-tight">
      Ưu đãi cực hời -<br/>Chỉ hôm nay!
    </h1>
    
    <!-- Countdown Timer (Glassmorphic) -->
    @if (!isExpired()) {
      <div class="glass-panel rounded-xl p-4 inline-flex items-center gap-4 mb-6"
           role="timer"
           [attr.aria-label]="'homepage.flashSale.timeRemaining' | translate">
        <div class="flex flex-col items-center">
          <span class="text-4xl md:text-5xl font-bold text-[#ff8928]">{{ formatTime(timeRemaining().hours) }}</span>
          <span class="text-xs font-medium uppercase text-white/90 mt-1">HOURS</span>
        </div>
        <span class="text-3xl md:text-4xl font-bold text-white/60">:</span>
        <div class="flex flex-col items-center">
          <span class="text-4xl md:text-5xl font-bold text-[#ff8928]">{{ formatTime(timeRemaining().minutes) }}</span>
          <span class="text-xs font-medium uppercase text-white/90 mt-1">MINS</span>
        </div>
        <span class="text-3xl md:text-4xl font-bold text-white/60">:</span>
        <div class="flex flex-col items-center">
          <span class="text-4xl md:text-5xl font-bold text-[#ff8928]">{{ formatTime(timeRemaining().seconds) }}</span>
          <span class="text-xs font-medium uppercase text-white/90 mt-1">SECS</span>
        </div>
      </div>
    }
    
    <div>
      <button class="bg-[#6db33f] hover:bg-[#5a9633] text-white font-bold text-base px-8 py-4 rounded-full transition-all duration-300 shadow-xl hover:shadow-2xl hover:scale-105 flex items-center gap-2">
        Mua Ngay
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
      </button>
    </div>
  </div>
</section>

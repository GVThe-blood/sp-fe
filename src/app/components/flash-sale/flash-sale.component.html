<!-- Flash Sale Hero Banner -->
<section class="w-full rounded-[24px] overflow-hidden relative min-h-[400px] md:min-h-[500px] flex items-center justify-start p-8 md:p-16 soft-shadow group">
  <!-- Background Image -->
  <div class="absolute inset-0 z-0">
    <img 
      alt="Delicious food spread" 
      class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-1000" 
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuDbaeZcWsT5Zbrc3wu9VwzpRO5aAQsyuvg_rIFo7LE6rxw5bwdR557qCTt4B2ByWDow6QUs61eXJvVCQiVBpPL_nrGICw2be1sLJ6o5qEOxNncXw8sM1hZpdOLQDzVOpA493uwbFPd_Q8O87cshbRhsM3o6e2DaCm5uZ0IJ0tiD91OBd9RlpgJ1jrsCEdjWg9m2wMEmFNHXdQdxUGzX9ufPDlPqv5Aaq22bYaZgt03S8UQmhyHx9PxMIk2hl4BtLKlgvZKuH3jOVcB4"
    />
    <!-- Gradient Overlay for text legibility -->
    <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent"></div>
  </div>
  
  <!-- Content -->
  <div class="relative z-10 max-w-lg text-on-primary">
    <span class="inline-block px-3 py-1 bg-secondary-container text-on-secondary-container font-label-md text-[12px] uppercase tracking-widest rounded-full mb-4">
      Flash Sale
    </span>
    <h1 class="font-display-lg text-display-lg mb-6 leading-tight">
      Ưu đãi cực hời -<br/>Chỉ hôm nay!
    </h1>
    
    <!-- Countdown Timer (Glassmorphic) -->
    @if (!isExpired()) {
      <div class="glass-panel rounded-xl p-4 inline-flex items-center gap-4 mb-8"
           role="timer"
           [attr.aria-label]="'homepage.flashSale.timeRemaining' | translate">
        <div class="flex flex-col items-center">
          <span class="font-headline-md text-headline-md text-secondary-container">{{ formatTime(timeRemaining().hours) }}</span>
          <span class="font-label-md text-[10px] uppercase text-on-primary/80">Hours</span>
        </div>
        <span class="text-2xl font-bold text-on-primary/50 mb-4">:</span>
        <div class="flex flex-col items-center">
          <span class="font-headline-md text-headline-md text-secondary-container">{{ formatTime(timeRemaining().minutes) }}</span>
          <span class="font-label-md text-[10px] uppercase text-on-primary/80">Mins</span>
        </div>
        <span class="text-2xl font-bold text-on-primary/50 mb-4">:</span>
        <div class="flex flex-col items-center">
          <span class="font-headline-md text-headline-md text-secondary-container">{{ formatTime(timeRemaining().seconds) }}</span>
          <span class="font-label-md text-[10px] uppercase text-on-primary/80">Secs</span>
        </div>
      </div>
    }
    
    <div>
      <button class="bg-primary-container hover:bg-primary-container/90 text-on-primary font-label-md text-label-md px-8 py-4 rounded-full transition-transform active:scale-95 shadow-lg flex items-center gap-2">
        Mua Ngay
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
      </button>
    </div>
  </div>
</section>

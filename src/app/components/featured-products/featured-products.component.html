<section class="py-12">
  <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Title -->
    <h2 class="text-4xl font-bold text-[#181c1e] mb-8">
      {{ 'homepage.featuredProducts.title' | translate }}
    </h2>
    
    <!-- Product Grid (3 columns desktop, 2 tablet, 1 mobile) -->
    <div class="relative">
      <!-- Left Navigation Button -->
      @if (canGoPrevious()) {
        <button 
          (click)="previousPage()"
          class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-16 z-10
                 w-12 h-12 rounded-full bg-white/90 backdrop-blur-sm shadow-lg 
                 flex items-center justify-center text-gray-600 hover:bg-white 
                 transition-all hover:scale-110 border border-gray-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
      }
      
      <!-- Right Navigation Button -->
      @if (canGoNext()) {
        <button 
          (click)="nextPage()"
          class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-16 z-10
                 w-12 h-12 rounded-full bg-white/90 backdrop-blur-sm shadow-lg 
                 flex items-center justify-center text-gray-600 hover:bg-white 
                 transition-all hover:scale-110 border border-gray-200">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      }
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        @for (product of products(); track product.id) {
          <app-product-item 
            [product]="product"
            (productClick)="onProductClick(product)"
            (favoriteClick)="onFavoriteClick($event)"
            (addToCartClick)="onAddToCartClick(product)">
          </app-product-item>
        }
      </div>
    </div>
    
    <!-- Pagination Controls -->
    @if (totalPages() > 1) {
      <div class="mt-8 flex items-center justify-center gap-6">
        <!-- Previous Button -->
        <button 
          (click)="previousPage()"
          [disabled]="!canGoPrevious()"
          class="w-10 h-10 rounded-full flex items-center justify-center transition-all
                 disabled:opacity-30 disabled:cursor-not-allowed
                 enabled:hover:bg-gray-100 enabled:text-gray-700 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        
        <!-- Page Indicator -->
        <div class="text-sm font-medium text-gray-600">
          {{ currentPage() }} / {{ totalPages() }}
        </div>
        
        <!-- Next Button -->
        <button 
          (click)="nextPage()"
          [disabled]="!canGoNext()"
          class="w-10 h-10 rounded-full flex items-center justify-center transition-all
                 disabled:opacity-30 disabled:cursor-not-allowed
                 enabled:hover:bg-gray-100 enabled:text-gray-700 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    }
  </div>
</section>

<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
  <p class="text-sm font-semibold tracking-wider text-slate-500 mb-2 uppercase">{{ data().label }}</p>
  <h4 
    class="text-2xl font-bold mb-4"
    [ngClass]="data().isWarning ? 'text-red-600' : 'text-gray-900'">
    {{ data().value }}
  </h4>
  <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
    <div 
      class="h-full" 
      [style.width.%]="data().progress"
      [style.background-color]="data().progressColor">
    </div>
  </div>
  @if (data().target) {
    <p class="text-[10px] text-slate-400 mt-2 font-bold uppercase">{{ data().target }}</p>
  }
</div>

<div class="analytics-page">
  <!-- Sidebar -->
  <app-store-sidebar [activeRoute]="'/my-store/analytics'"></app-store-sidebar>

  <!-- Main Content -->
  <div class="analytics-content">

    <!-- Top Nav / Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 flex justify-between items-center px-8 h-16 w-full shadow-sm rounded-2xl mb-8">
      <div class="flex items-center gap-4">
        <h2 class="text-2xl font-bold text-gray-900">Phân Tích Dữ Liệu</h2>
        <span class="text-slate-300">|</span>
        <p class="text-base text-slate-500">Tổng quan hiệu suất thời gian thực</p>
      </div>
      <div class="flex items-center gap-6">
        <div class="relative flex items-center hidden md:flex">
          <span class="material-symbols-outlined absolute left-3 text-slate-400">search</span>
          <input class="pl-10 pr-4 py-2 bg-slate-50 border-none rounded-full text-sm focus:ring-2 focus:ring-green-500 w-64 transition-all" placeholder="Tìm kiếm phân tích..." type="text"/>
        </div>
        <div class="flex items-center gap-4 text-slate-500">
          <button class="hover:bg-slate-50 p-2 rounded-full transition-colors relative">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-2 right-2 w-2 h-2 bg-orange-500 rounded-full border-2 border-white"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="space-y-8">
      <!-- KPI Summary Grid -->
      <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        @for (kpi of kpiData(); track $index) {
          <app-kpi-card [data]="kpi" />
        }
      </section>

      <!-- Main Chart Section -->
      <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Profit Chart -->
        <div class="lg:col-span-2">
          <app-profit-chart [data]="profitChartData()" />
        </div>

        <!-- Sales Channel Chart -->
        <app-sales-channel-chart [data]="salesChannelData()" />
      </section>

      <!-- Bento Grid: Secondary Metrics & Traffic -->
      <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Avg Order Value -->
        <app-metric-card [data]="avgOrderValue()" />
        
        <!-- Return Rate -->
        <app-metric-card [data]="returnRate()" />
        
        <!-- Traffic Sources -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-2">
          <div class="flex justify-between items-center mb-4">
            <p class="text-sm font-semibold tracking-wider text-slate-500 uppercase">Nguồn Lưu Lượng</p>
            <button class="text-green-700 text-xs font-bold flex items-center">
              Xem chi tiết 
              <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            </button>
          </div>
          <div class="grid grid-cols-3 gap-4">
            @for (source of trafficSources(); track source.name) {
              <div class="text-center p-3 bg-slate-50 rounded-xl">
                <span class="text-base font-bold block text-gray-900">{{ source.name }}</span>
                <span class="text-xs text-slate-400">{{ source.percentage }}%</span>
              </div>
            }
          </div>
        </div>
      </section>

      <!-- Top Selling Products Table -->
      <app-top-products-table 
        [products]="topProducts()" 
        (exportData)="handleExportData()" />

    </div>
  </div>
</div>

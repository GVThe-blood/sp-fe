<app-color-ribbon></app-color-ribbon>

<!-- Main Content Canvas -->
<main class="pt-[90px] md:pt-[100px] pb-section-gap min-h-screen max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop flex flex-col gap-section-gap">
  <!-- Delivery Location Bar -->
  <section class="w-full max-w-2xl mx-auto -mt-6 relative z-40">
    <div class="bg-surface-container-lowest rounded-full p-2 flex items-center gap-3 soft-shadow border border-surface-variant">
      <div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary-container shrink-0">
        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
      </div>
      <div class="flex-1 flex flex-col justify-center">
        <span class="font-label-md text-label-md text-on-surface-variant text-[10px] uppercase tracking-wider leading-none mb-1">Giao tới</span>
        <input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface placeholder-tertiary outline-none truncate" placeholder="Nhập địa chỉ giao hàng..." type="text" [value]="deliveryAddress()"/>
      </div>
      <button class="w-10 h-10 rounded-full hover:bg-surface-container-low flex items-center justify-center text-tertiary transition-colors shrink-0">
        <span class="material-symbols-outlined text-[20px]">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- Category Chips -->
  <section class="w-full -mt-10 overflow-hidden relative">
    <!-- Fade edges for scroll indication -->
    <div class="absolute left-0 top-0 bottom-0 w-8 bg-gradient-to-r from-background to-transparent z-10 pointer-events-none"></div>
    <div class="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-background to-transparent z-10 pointer-events-none"></div>
    <div class="flex items-center gap-4 overflow-x-auto hide-scrollbar py-4 px-2">
      @for (category of categories(); track category.id) {
        <button
          (click)="setActiveCategory(category.id)"
          [class]="category.id === activeCategoryId() ?
            'flex items-center gap-2 bg-primary-container text-on-primary px-5 py-3 rounded-full shrink-0 shadow-sm transition-transform hover:-translate-y-0.5' :
            'flex items-center gap-2 bg-surface-container-lowest text-on-surface border border-outline-variant px-5 py-3 rounded-full shrink-0 hover:border-primary-container hover:text-primary-container transition-all'">
          <span class="material-symbols-outlined text-[20px]" [style.font-variation-settings]="category.iconFill && category.id === activeCategoryId() ? '\'FILL\' 1' : ''">{{ category.icon }}</span>
          <span class="font-label-md text-label-md">{{ category.name }}</span>
        </button>
      }
    </div>
  </section>

  <!-- Flash Sale Hero Banner (Combined Hero + Flash Sale) -->
  @if (flashSaleActive()) {
    <section class="mb-20">
      <app-flash-sale (saleEnded)="onFlashSaleEnded()"></app-flash-sale>
    </section>
  }

  <!-- Featured Products Section -->
  <section class="mb-20">
    <app-featured-products></app-featured-products>
  </section>
</main>

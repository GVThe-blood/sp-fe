<app-color-ribbon></app-color-ribbon>

<!-- Main Content Canvas -->
<main class="pt-[90px] md:pt-[100px] pb-section-gap min-h-screen max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop flex flex-col gap-section-gap">
  <!-- Hero Carousel (Auto-rotating banners: Flash Sale, Promotions, Announcements) -->
  <section class="mb-12 -mt-6">
    <app-hero-carousel></app-hero-carousel>
  </section>

  <!-- Category Chips -->
  <section class="w-full overflow-hidden relative -mt-6 mb-8">
    <!-- Left scroll button -->
    @if (canScrollLeft()) {
      <button 
        #leftBtn
        (click)="scrollCategoriesLeft(categoryContainer)"
        class="absolute left-0 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm shadow-lg flex items-center justify-center text-gray-700 hover:bg-white transition-all">
        <span class="material-symbols-outlined text-[20px]">chevron_left</span>
      </button>
    }
    
    <!-- Right scroll button -->
    @if (canScrollRight()) {
      <button 
        #rightBtn
        (click)="scrollCategoriesRight(categoryContainer)"
        class="absolute right-0 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm shadow-lg flex items-center justify-center text-gray-700 hover:bg-white transition-all">
        <span class="material-symbols-outlined text-[20px]">chevron_right</span>
      </button>
    }
    
    <!-- Fade edges for scroll indication -->
    <div class="absolute left-0 top-0 bottom-0 w-12 bg-gradient-to-r from-background to-transparent z-10 pointer-events-none"></div>
    <div class="absolute right-0 top-0 bottom-0 w-12 bg-gradient-to-l from-background to-transparent z-10 pointer-events-none"></div>
    
    <div 
      #categoryContainer
      (scroll)="updateScrollButtons(categoryContainer)"
      class="flex items-center justify-start gap-4 overflow-x-auto hide-scrollbar py-4 px-2">
      @for (category of categories(); track category.id) {
        <button
          (click)="setActiveCategory(category.id)"
          [class]="category.id === activeCategoryId() ?
            'flex items-center gap-2 bg-[#6db33f] text-white px-5 py-3 rounded-full shrink-0 shadow-md transition-all hover:bg-[#5a9633] hover:-translate-y-0.5' :
            'flex items-center gap-2 bg-white text-gray-700 border border-gray-300 px-5 py-3 rounded-full shrink-0 hover:border-[#6db33f] hover:text-[#6db33f] hover:bg-green-50 transition-all'">
          <span class="material-symbols-outlined text-[20px]" [style.font-variation-settings]="category.id === activeCategoryId() ? '\'FILL\' 1' : ''">{{ category.icon }}</span>
          <span class="font-medium text-sm">{{ category.name }}</span>
        </button>
      }
    </div>
  </section>

  <!-- Delivery Location Bar -->
  <section class="w-full max-w-2xl mx-auto mb-10 relative z-40">
    <div class="bg-white rounded-full p-3 flex items-center gap-3 shadow-lg border border-gray-200">
      <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-[#6db33f] shrink-0">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
      </div>
      <div class="flex-1 flex flex-col justify-center">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider leading-none mb-1">Giao tới</span>
        <input class="w-full bg-transparent border-none p-0 focus:ring-0 text-base font-medium text-gray-800 placeholder-gray-400 outline-none truncate" placeholder="Nhập địa chỉ giao hàng..." type="text" [value]="deliveryAddress()"/>
      </div>
      <button class="w-12 h-12 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600 transition-colors shrink-0">
        <span class="material-symbols-outlined text-[24px]">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- Featured Products Section -->
  <section class="mb-20">
    <app-featured-products></app-featured-products>
  </section>

  <!-- Featured Shops Section -->
  <section class="mb-20">
    <app-featured-shops></app-featured-shops>
  </section>
</main>
